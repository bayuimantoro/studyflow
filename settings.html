<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - StudyFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{primary:'#378ADD'},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-gray-50 font-sans p-8 flex justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">Settings</h1>
            <a href="dashboard.html" class="text-primary text-sm hover:underline">Back to Dashboard</a>
        </div>

        <form id="name-form" class="mb-6 space-y-3">
            <h2 class="font-semibold text-gray-700">Update Name</h2>
            <input type="text" id="name-input" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary" placeholder="New Full Name" required>
            <button type="submit" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-600">Save Name</button>
        </form>

        <form id="pass-form" class="mb-8 space-y-3">
            <h2 class="font-semibold text-gray-700">Change Password</h2>
            <input type="password" id="pass-input" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:outline-none focus:border-primary" placeholder="New Password (min 6 chars)" required minlength="6">
            <button type="submit" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-600">Update Password</button>
        </form>

        <div class="pt-6 border-t border-red-100">
            <h2 class="font-semibold text-red-600 mb-2">Danger Zone</h2>
            <p class="text-xs text-gray-500 mb-3">Deleting your account is permanent.</p>
            <button onclick="deleteAccount()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-red-100 border border-red-200">Delete Account</button>
        </div>
    </div>

    <script>
        const sb=window.supabase.createClient('https://vmullhzdnosjnnwgsang.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtdWxsaHpkbm9zam5ud2dzYW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMzkwNTQsImV4cCI6MjA5MzkxNTA1NH0.OcNK92Ong-rDUKjEC-3l47B7uEJYuMViTedaDrFc2rw');
        
        (async()=>{
            const{data:{session}}=await sb.auth.getSession();
            if(!session) window.location.href='login.html';
        })();

        document.getElementById('name-form').onsubmit = async(e)=>{
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.textContent='Saving...';
            await sb.auth.updateUser({data:{full_name:document.getElementById('name-input').value}});
            alert('Name updated'); btn.textContent='Save Name'; document.getElementById('name-input').value='';
        };

        document.getElementById('pass-form').onsubmit = async(e)=>{
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.textContent='Saving...';
            const {error} = await sb.auth.updateUser({password:document.getElementById('pass-input').value});
            if(error) alert(error.message); else alert('Password updated');
            btn.textContent='Update Password'; document.getElementById('pass-input').value='';
        };

        async function deleteAccount(){
            if(confirm('Are you sure you want to permanently delete your account?')){
                const {error} = await sb.rpc('delete_user');
                if(error) alert('Failed: run the SQL RPC in Supabase first.');
                else { await sb.auth.signOut(); window.location.href='index.html'; }
            }
        }
    </script>
</body>
</html>
